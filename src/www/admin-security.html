<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>绑定通行密钥 · GMPay</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; background: #09090b; color: #fafafa; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1, h2 { margin: 0; } h1 { font-size: 28px; } h2 { font-size: 19px; }
    p { color: #a1a1aa; line-height: 1.6; }
    a { color: #67e8f9; text-decoration: none; }
    .card { border: 1px solid #27272a; border-radius: 16px; background: #18181b; padding: 22px; margin-bottom: 18px; }
    label { display: grid; gap: 7px; margin-top: 14px; color: #d4d4d8; font-size: 14px; }
    input { box-sizing: border-box; width: 100%; border: 1px solid #3f3f46; border-radius: 9px; background: #09090b; color: #fff; padding: 11px 12px; font: inherit; }
    button { margin-top: 16px; border: 0; border-radius: 9px; background: #fafafa; color: #09090b; padding: 11px 15px; font-weight: 650; cursor: pointer; }
    button.danger { margin: 0; background: #7f1d1d; color: #fecaca; }
    .message { min-height: 22px; margin: 14px 0 0; color: #a7f3d0; white-space: pre-wrap; }
    .message.error { color: #fca5a5; }
    .passkey { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #27272a; padding: 13px 0; }
    .note { border-left: 3px solid #f59e0b; padding-left: 12px; }
  </style>
</head>
<body>
<main>
  <header><div><h1>绑定通行密钥</h1><p>使用数据库中预置的 TOTP 密钥完成身份验证。</p></div><a href="/sign-in">返回登录</a></header>
  <p class="note">系统不会在后台生成或修改 TOTP 密钥。账号没有配置 TOTP 密钥时，动态口令登录和通行密钥绑定都会被拒绝。</p>
  <section class="card">
    <h2>添加通行密钥</h2>
    <p>支持 Touch ID、Face ID、Windows Hello 和硬件安全密钥。</p>
    <label>登录名<input id="passkey-username" autocomplete="username" maxlength="64"></label>
    <label>6 位动态口令<input id="passkey-totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <label>密钥名称<input id="passkey-name" maxlength="80" placeholder="例如：MacBook Touch ID"></label>
    <button id="passkey-register">验证并绑定通行密钥</button>
    <p id="passkey-message" class="message"></p>
  </section>
  <section class="card">
    <h2>已注册的通行密钥</h2>
    <div id="passkey-list"><p>读取中…</p></div>
  </section>
</main>
<script src="/admin-security.js"></script>
</body>
</html>
